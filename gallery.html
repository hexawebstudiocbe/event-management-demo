<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Aura Events</title>
    <meta name="description" content="Browse our extensive gallery of luxury events, decorations, and memorable moments.">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    
    <link rel="stylesheet" href="css/variables.css?v=4">
    <link rel="stylesheet" href="css/utilities.css?v=4">
    <link rel="stylesheet" href="css/animations.css?v=4">
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/responsive.css?v=4">

    <style>
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .filter-btn {
            background: transparent;
            border: 2px solid var(--clr-primary);
            color: var(--clr-secondary);
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--clr-primary);
            color: var(--clr-accent);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            height: 250px;
            transition: all 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(27, 27, 27, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: var(--clr-accent);
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-icon {
            width: 50px;
            height: 50px;
            background: var(--clr-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            transform: translateY(20px);
            transition: transform 0.3s ease 0.1s;
        }

        .gallery-item:hover .gallery-icon {
            transform: translateY(0);
        }

        /* Lightbox Styles */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--border-radius);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: -40px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: var(--clr-primary);
        }

        .lightbox-caption {
            color: #fff;
            text-align: center;
            margin-top: 10px;
            font-size: 1.2rem;
            font-family: var(--font-heading);
        }

        @media (max-width: 768px) {
            .lightbox-close {
                top: -30px;
                right: 0;
            }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <img src="assets/images/backgrounds/gallery_bg.jpg" alt="Gallery Background" class="page-header-bg">
        <div class="page-header-content" data-aos="fade-up">
            <h1>Event Gallery</h1>
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Gallery</span>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <!-- Filter Buttons -->
            <div class="filter-container" data-aos="fade-up">
                <button class="filter-btn active" data-filter="all">All Events</button>
                <button class="filter-btn" data-filter="wedding">Weddings</button>
                <button class="filter-btn" data-filter="corporate">Corporate</button>
                <button class="filter-btn" data-filter="decoration">Decoration</button>
            </div>

            <!-- Gallery Grid -->
            <div class="gallery-grid" data-aos="fade-up" data-aos-delay="100">
                <!-- Item 1 -->
                <a href="assets/images/gallery/wedding-1.jpg" data-lightbox data-caption="Traditional Tamil Wedding" class="gallery-item" data-category="wedding">
                    <img src="assets/images/gallery/wedding-1.jpg" alt="Wedding" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Wedding Reception</h4>
                    </div>
                </a>
                
                <!-- Item 2 -->
                <a href="assets/images/gallery/corporate-1.jpg" data-lightbox data-caption="Corporate Gala Dinner" class="gallery-item" data-category="corporate">
                    <img src="assets/images/gallery/corporate-1.jpg" alt="Corporate" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Corporate Gala</h4>
                    </div>
                </a>
                
                <!-- Item 3 -->
                <a href="assets/images/gallery/decoration-1.jpg" data-lightbox data-caption="Grand Stage Setup" class="gallery-item" data-category="decoration">
                    <img src="assets/images/gallery/decoration-1.jpg" alt="Decoration" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Stage Setup</h4>
                    </div>
                </a>
                
                <!-- Item 4 -->
                <a href="assets/images/gallery/wedding-2.jpg" data-lightbox data-caption="Sangeet Ceremony" class="gallery-item" data-category="wedding">
                    <img src="assets/images/gallery/wedding-2.jpg" alt="Wedding" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Sangeet</h4>
                    </div>
                </a>
                
                <!-- Item 5 -->
                <a href="assets/images/gallery/corporate-2.jpg" data-lightbox data-caption="Tech Conference Stage" class="gallery-item" data-category="corporate">
                    <img src="assets/images/gallery/corporate-2.jpg" alt="Corporate" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Conference</h4>
                    </div>
                </a>
                
                <!-- Item 6 -->
                <a href="assets/images/gallery/decoration-2.jpg" data-lightbox data-caption="Floral Decoration" class="gallery-item" data-category="decoration">
                    <img src="assets/images/gallery/decoration-2.jpg" alt="Decoration" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="gallery-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                        <h4>Floral Setup</h4>
                    </div>
                </a>
            </div>

            <div class="text-center mt-3">
                <button class="btn btn-primary" id="loadMore">Load More Images</button>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
    <script src="js/utils.js?v=4" defer></script>
    <script src="js/navigation.js?v=4" defer></script>
    <script src="js/aos-init.js?v=4" defer></script>
    <script src="js/gallery-filter.js?v=4" defer></script>
    <script src="js/lightbox.js?v=4" defer></script>
    <script src="js/scroll-effects.js?v=4" defer></script>
    <script src="js/main.js?v=4" defer></script>
</body>
</html>
