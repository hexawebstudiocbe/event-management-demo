<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Aura Events</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/variables.css?v=4">
    <link rel="stylesheet" href="css/utilities.css?v=4">
    <link rel="stylesheet" href="css/style.css?v=4">

    <style>
        .error-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--clr-bg);
            flex-direction: column;
        }

        .error-code {
            font-size: 8rem;
            font-family: var(--font-heading);
            color: var(--clr-primary);
            line-height: 1;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="error-page container">
        <h1 class="error-code">404</h1>
        <h2 class="mb-2">Oops! Page Not Found</h2>
        <p class="mb-3" style="max-width: 500px; margin-left: auto; margin-right: auto; color: var(--clr-text-light);">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn btn-primary">Return Home</a>
    </div>

    <script src="js/utils.js?v=4" defer></script>
    <script src="js/navigation.js?v=4" defer></script>
    <script src="js/main.js?v=4" defer></script>
</body>
</html>
